[workspace]
resolver = "2"
members = ["core", "cli", "ffi", "hooks"]

# Size-optimised default, matching dataflow/Sensors/AI/cyberhaven-agent-inspector — this runs on
# the endpoint, so binary size and startup cost matter (see ../CLAUDE.md resource budget).
#
# panic = "unwind", not "abort": extract.rs's PDF path wraps pdf-extract in catch_unwind (it can
# panic, not just error, on malformed input -- CLAUDE.md requires extraction failure to report
# readable:false, never crash the caller). catch_unwind is a no-op under panic=abort, so a plain
# `cargo build --release` of the CLI/hooks binaries used to hard-abort on such a PDF even though
# the guard was already written -- found via a real Nucleuz-corpus PDF (2026-09), confirmed Go's
# ledongthuc/pdf handles the same file as an ordinary error, not a panic, so this was a Rust-only
# gap. The one artifact this project would actually embed on an endpoint (ch-inspect-ffi) already
# had to run under unwind for its own FFI catch_unwind boundary to work at all (see below), so
# this default was never protecting a real production build's size in the first place -- only
# dev tools (cli, hooks) built under the plain "abort" default, which is exactly what crashed.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# Redundant with the workspace default above now (both unwind), kept because it's the crate whose
# correctness actually *depends* on unwind rather than merely benefiting from it: an unwind that
# crosses an extern "C" boundary into a non-Rust host (C#, Swift, C/C++) is process corruption,
# not a recoverable error, so every exported fn wraps its body in catch_unwind instead -- same
# pattern as the `ca` crate in cyberhaven-agent-inspector. Build the ffi crate explicitly with:
#   cargo build -p ch-inspect-ffi --profile release-ffi
[profile.release-ffi]
inherits = "release"
panic = "unwind"
